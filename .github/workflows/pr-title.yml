name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check the title starts with a type
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^([Ff]eat|[Ff]ix|[Cc]hore|[Rr]efactor|[Dd]ocs|[Tt]est|[Pp]erf|[Bb]uild|CI|ci|[Rr]evert)(\([a-z0-9-]+\))?: [^ ]'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR titles look like \"Fix: short description\" or \"fix(recall): short description\". Types: feat, fix, chore, refactor, docs, test, perf, build, ci, revert."
            exit 1
          fi
