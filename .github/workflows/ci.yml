name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the title starts with a type
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^([Ff]eat|[Ff]ix|[Cc]hore|[Rr]efactor|[Dd]ocs|[Tt]est|[Pp]erf|[Bb]uild|CI|ci|[Rr]evert)(\([a-z0-9-]+\))?: [^ ]'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR titles look like \"Fix: short description\" or \"fix(recall): short description\". Types: feat, fix, chore, refactor, docs, test, perf, build, ci, revert."
            exit 1
          fi

  rust:
    name: Rust (${{ matrix.os }})
    needs: title
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    name: Dependency policy
    needs: title
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
