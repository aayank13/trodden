[package]
name = "trodden"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Procedural memory for coding agents"
publish = false

[dependencies]
anyhow.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
jiff.workspace = true
rmcp = { version = "3.5.0", features = ["server", "transport-io", "macros"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.53.1", features = ["rt", "io-std"] }
trodden-capture.workspace = true
trodden-core.workspace = true
trodden-embed.workspace = true
trodden-extract.workspace = true
trodden-learn.workspace = true
trodden-recall.workspace = true
trodden-redact.workspace = true
trodden-store.workspace = true

[lints]
workspace = true

[dev-dependencies]
trodden-core = { workspace = true, features = ["test-support"] }
rand = { version = "0.10.3", default-features = false, features = ["std"] }
